# Фаза 10 — Identity: Keycloak 26 (26.7.3, OIDC-провайдер кластера), ns identity.
#
# Модель (решение kate 2026-09-14, lab-plan.md «Фаза 10»):
# - образ quay.io/keycloak/keycloak:26.7.3 (ПЛОСКИЙ Deployment без operator'а),
#   режим start-dev — лаба. Чарт bitnami НЕ используется (legacy-registry,
#   решение плана). ОТКЛОНЕНИЕ (2026-09-14): план указывал тег `26`, но в
#   registry quay.io/keycloak/keycloak тега `26` НЕТ (подтверждено
#   ImagePullBackOff NotFound + list tags: существуют 26.x/26.x.y/26.7/
#   latest) → зафиксирован самый свежий патч линейки 26: 26.7.3.
# - Хранение: PVC keycloak-data 2Gi, SC longhorn-test (replicas=2 на 2 узлах;
#   дефолтный longhorn replicas=3 не планируется — не использовать).
#   БД: KC_DB=dev-file (H2 file-based в /opt/keycloak/data = PVC). Отклонение
#   от production-модели (Postgres) зафиксировано: лаба, данных мало, PVC даёт
#   переживаемость рестартов + бэкап тома через RecurringJob.
# - Лейблы бэкапа: на PVC НЕ ставятся (грабла 2026-09-14 — RecurringJob
#   смотрит лейблы на Volume CR, а не на PVC; Longhorn их НЕ копирует с PVC).
#   После Bound тома лейблы бьются на Volume CR:
#     kubectl label volume -n longhorn-system <pvc-<uid-pvc> \
#       recurring-job.longhorn.io/backup-once=enabled \
#       recurring-job-group.longhorn.io/backup-once-grp=enabled --overwrite
#   (модель harbor-томов; см. k8s-lab/csi/longhorn-backup-policy.yml).
# - Ingress keycloak.kubernetes.lab → Traefik LB 172.24.254.221, TLS
#   cert-manager ingress-shim (intermediate-ca-issuer) — та же модель, что
#   longhorn-ui/argocd/harbor (ingress.yml отдельно).
# - Ресурсы: requests 500m/1Gi, LIMIT memory 2560Mi (2.5Gi). Limit ОБЯЗАТЕЛЕН:
#   Keycloak 26 (Quarkus JVM) использует -XX:MaxRAMPercentage=70 — БЕЗ limit
#   JVM читает 8GB нода и резервирует heap до 5.6GB (проверено 2026-09-14:
#   это довело w0 до OOM/NotReady в сочетании с утечкой longhorn
#   instance-manager). С limit 2.5Gi: max heap 1.75Gi + off-heap — хватает для
#   лабы (realm k8s-lab, 1 клиент). W1 имеет 7.2Gi свободных.
# - hostname: --hostname=keycloak.kubernetes.lab — issuer должен совпадать с
#   ingress-хостом до байта (грабла плана). strict=false — лаба, внутренние
#   проверки с другими Host-заголовками не должны резаться.
#
# Secret keycloak-admin (пароль bootstrap-админа) НЕ в git:
#   kubectl -n identity create secret generic keycloak-admin \
#     --from-literal=password=<генерируется, в test-dir/keycloak-admin.local.txt>

---
apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    phase.kubernetes.lab: identity
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: identity
  labels:
    app: keycloak
    phase.kubernetes.lab: identity
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
  namespace: identity
  labels:
    app: keycloak
    phase.kubernetes.lab: identity
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-test
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
  labels:
    app: keycloak
    phase.kubernetes.lab: identity
spec:
  replicas: 1
  strategy:
    type: Recreate   # 1 реплика + RO PVC: RollingUpdate вешается на old pod
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        phase.kubernetes.lab: identity
    spec:
      serviceAccountName: keycloak
      # 2026-10-06 (Фаза 10 ремонт): после инцидента Longhorn том keycloak-data был
      # пересоздан ПУСТЫМ (ext4 root:root, данные потеряны в инциденте; бэкапов/снапшотов
      # нет). Keycloak 26 ходит от UID 1000 (USER keycloak) и не может писать в
      # root-owned /opt/keycloak/data -> "Failed to save truststore ... Permission
      # denied". fsGroup=1000 заставляет kubelet/Longhorn-CSI сделать том
      # group-writable (OnRootMismatch не переписывает всё дерево на уже больших томах),
      # runAsUser 1000 = штатный пользователь образа. С пустым томом keycloak
      # стартует start-dev и заново создаёт admin + дефолтный realm.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # w1: 7.2Gi free / 9% mem (2026-09-14) vs w0 63% mem + kubelet деградация
      # (TLS handshake timeout на :10250) во время первого Quarkus-build Keycloak
      # (>5 мин -> startup probe убил pod). Лаба 1 реплика — пилим на свободный узел.
      nodeSelector:
        kubernetes.io/hostname: w1.kubernetes.lab
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3
          command:
            - /opt/keycloak/bin/kc.sh
            - start-dev
            - --hostname=keycloak.kubernetes.lab
            - --hostname-strict=false
            - --http-port=8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: KC_DB
              value: dev-file
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            # Keycloak 26 (26.7.x): /health/* отдаются на MANAGEMENT-порту 9000,
            # а НЕ на http-порту 8080 (на 8080 /health/ready -> 404). Без этого
            # проба ниже валится и под никогда не становится Ready (ingress -> 503).
            # Зафиксировано 2026-10-06 при ремонте.
            - name: mgmt
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
          startupProbe:
            httpGet:
              path: /health/ready
              port: mgmt
            periodSeconds: 5
            failureThreshold: 120  # первый старт Quarkus-build >5 мин (проверено:
                                   # 60x5s не хватило на загруженном узле)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: mgmt
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: mgmt
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2560Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-data
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
  labels:
    app: keycloak
    phase.kubernetes.lab: identity
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 80
      targetPort: 8080
