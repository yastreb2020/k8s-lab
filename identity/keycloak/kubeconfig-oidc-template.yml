# Фаза 10 — kubeconfig для kubectl через OIDC (шаблон).
#
# Использование:
#   1. KUBECTL_OIDC_KC_PASS=<пароль kate> kubectl oidc login --oidc-arg=... —
#      ЛИБО ручной login:
#      kubectl --kubeconfig ~/.kube/config-oidc login --url-only
#      → браузер: логин в Keycloak (kate) → redirect на http://localhost:28085
#      (WSL2 localhost-forwarding: порт слушает WSL, браузер Windows ловит).
#   2. kubectl --kubeconfig ~/.kube/config-oidc get nodes
#
# Граблы (план + проверено при выполнении):
# - issuer обязан совпадать с ingress-хостом до байта:
#   https://keycloak.kubernetes.lab/realms/k8s-lab
# - idp-certs-ca-bundle: стендовый Neurotech CA (test-dir/neurotech-ca.crt,
#   в WSL уже в системном доверии /etc/ssl/certs/2d031efe.0).
# - kubectl НЕ умеет сам обновлять OIDC-токены (нет refresh в oidc-секции
#   kubeconfig) — при истечении access token (60s) повторный `kubectl oidc
#   login` / login в браузере. Для лабы приемлемо, задокументировано.
# - username-claim preferred_username, groups-claim groups (ключи OIDC
#   стандартные; Keycloak отдаёт оба по дефолту).
#
# Секреты (токен/refresh) — в ~/.kube/config-oidc, gitignored; шаблон без токена.
apiVersion: v1
kind: Config
clusters:
- cluster:
    server: https://api-server.kubernetes.lab:6443
    certificate-authority-data: <BASE64-СТЕНДОВОГО-ROOT-CA — из test-dir/neurotech-ca.crt>
  name: kubernetes-lab
contexts:
- context:
    cluster: kubernetes-lab
    user: kate-oidc
  name: kubernetes-lab-oidc
current-context: kubernetes-lab-oidc
users:
- name: kate-oidc
  user:
    oidc:
      issuer: https://keycloak.kubernetes.lab/realms/k8s-lab
      client-id: kubernetes
      idp-certs-ca-bundle: <BASE64-СТЕНДОВОГО-ROOT-CA — из test-dir/neurotech-ca.crt>
      username-claim: preferred_username
      groups-claim: groups
      # redirect-URI клиента Keycloak: http://localhost:28085
      # (порт слушает kubectl; WSL2 localhost-forwarding → браузер Windows)
