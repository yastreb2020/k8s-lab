# blackbox-probes.yml — Probe CR для мониторинга Ingress-эндпоинтов (Фаза 9.2)
#
# Следит за доступностью 8 HTTPS-эндпоинтов kubernetes.lab через blackbox-exporter.
# Создаёт в Prometheus job `ingress-https` с 8 таргетами (по одному на hostname);
# метрики: probe_success{instance="<hostname>"}, probe_http_status_code,
# probe_duration_seconds. Правила для алертов — см. blackbox-rules (опционально).
#
# Пометка release:kps обязательна: probeSelector прометея = {matchLabels:{release:kps}}.
# prober.url указывает на service blackbox (release `blackbox` + имя чарта).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ingress-https
  namespace: observability
  labels:
    release: kps
spec:
  jobName: ingress-https
  prober:
    url: blackbox-prometheus-blackbox-exporter.observability.svc.cluster.local:9115
  module: https_2xx
  interval: 60s
  targets:
    staticConfig:
      static:
        - https://argocd.kubernetes.lab
        - https://harbor.kubernetes.lab
        - https://keycloak.kubernetes.lab/realms/master/.well-known/openid-configuration
        - https://lab-demo.kubernetes.lab
        - https://longhorn.kubernetes.lab
        - https://grafana.kubernetes.lab
        - https://prometheus.kubernetes.lab
        - https://alertmanager.kubernetes.lab