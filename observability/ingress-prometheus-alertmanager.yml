# Ingress для Prometheus и Alertmanager (kube-prometheus-stack, ns observability).
# Traefik LB 172.24.254.221, TLS cert-manager intermediate-ca-issuer.
# Бэкенды — штатные сервисы KPS: kps-*-prometheus:9090, kps-*-alertmanager:9093.
# NetPol: edge-доступ разрешён в observability-allow (ports 9090/9093).
#
# Внешний доступ (kate): /etc/hosts 172.24.254.221 prometheus.kubernetes.lab
#   alertmanager.kubernetes.lab  +  CA Neurotech (neurotech-ca.crt).

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kps-prometheus
  namespace: observability
  labels:
    phase.kubernetes.lab: observability
  annotations:
    cert-manager.io/cluster-issuer: intermediate-ca-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - prometheus.kubernetes.lab
      secretName: prometheus-tls
  rules:
    - host: prometheus.kubernetes.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kps-kube-prometheus-stack-prometheus
                port:
                  number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kps-alertmanager
  namespace: observability
  labels:
    phase.kubernetes.lab: observability
  annotations:
    cert-manager.io/cluster-issuer: intermediate-ca-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - alertmanager.kubernetes.lab
      secretName: alertmanager-tls
  rules:
    - host: alertmanager.kubernetes.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kps-kube-prometheus-stack-alertmanager
                port:
                  number: 9093