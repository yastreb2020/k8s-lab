# Фаза 7.2 — Loki datasource для Grafana (KPS sidecar, label grafana_datasource)
# URL = gateway (nginx -> Loki, single-tenant, auth_enabled=false):
# Grafana сам дописывает /loki/api/v1/* (подтверждено: push/query_range работают).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  loki-ds.yml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
        isDefault: false
        editable: true
