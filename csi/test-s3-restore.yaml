apiVersion: v1
kind: PersistentVolume
metadata:
  name: restore-backup-s3 # Имя PV должно совпадать с именем вольюма в Longhorn
spec:
  capacity:
    storage: 1Gi # Должно быть столько же, сколько в оригинальном томе
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    volumeHandle: restore-backup-s3 # ТУТ самое важное: имя вольюма из UI
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-restore-s3
spec:
  storageClassName: longhorn-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi # Размер должен быть не больше, чем был у оригинального тома
  volumeName: restore-backup-s3
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-restore-check
spec:
  containers:
    - name: checker
      image: alpine
      command: ["/bin/sh", "-c"]
      args:
        - echo "Checking recovered data..."; 
          cat /data/test-file.txt; 
          sleep 3600
      volumeMounts:
        - name: restored-storage
          mountPath: /data
  volumes:
    - name: restored-storage
      persistentVolumeClaim:
        claimName: pvc-restore-s3