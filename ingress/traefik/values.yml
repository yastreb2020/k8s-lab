# Traefik Helm Values for kubernetes.lab

# Deployment configuration
deployment:
  enabled: true
  kind: Deployment
  replicas: 1

# Service configuration (integrates with MetalLB)
service:
  enabled: true
  type: LoadBalancer

# Traefik entrypoints (web/80 and websecure/443)
ports:
  traefik:
    expose:
      default: true
    # Note: we override the default port 8080 to 80/443 via additionalArguments or EntryPoints config if needed, 
    # but for standard Ingress, Traefik uses its internal entrypoints.

# TLS: сертификаты выпускает cert-manager (shim), в ACME-resolverе Traefik нет
# необходимости (DNS *.kubernetes.lab ручной, challenge невозможен)

# RBAC configuration
rbac:
  enabled: true

# Gateway API (Фаза 11): включаем provider Traefik.
# CRD ставятся отдельно (gateway-api-crds-v1.2.0.yaml).
# Статус Gateway берётся из LoadBalancer-сервиса traefik/traefik (MetalLB 172.24.254.221).
# gateway.enabled в чарте НЕ включаем: Gateway-объекты ведёт репо (gateway.yml).
providers:
  kubernetesGateway:
    enabled: true
