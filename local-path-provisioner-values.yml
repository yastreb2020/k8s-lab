replicaCount: 1

image:
  repository: rancher/local-path-provisioner
  tag: v0.0.34
  pullPolicy: IfNotPresent

helperImage:
  repository: busybox
  tag: latest

defaultSettings:
  registrySecret: ~

privateRegistry:
  registryUrl: ~
  registryUser: ~
  registryPasswd: ~

imagePullSecrets: []

storageClass:
  create: true
  defaultClass: false
  defaultVolumeType: hostPath
  name: local-path
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer

nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
      - /opt/local-path-provisioner

hostUsers: true

rbac:
  create: true

serviceAccount:
  create: true

podDisruptionBudget:
  enabled: false

configmap:
  name: local-path-config
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod:
    namespaceOverride: ""
    name: "helper-pod"
    annotations: {}
    tolerations: []
    priorityClassName: "system-node-critical"
extraArgs: []