apiVersion: v1
kind: Namespace
metadata:
  name: dr-test
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-dr-restore
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn-test
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
    volumeHandle: dr-restore
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dr-restore-pvc
  namespace: dr-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-test
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: dr-restore-pod
  namespace: dr-test
spec:
  restartPolicy: Never
  containers:
    - name: restore-check
      image: busybox:1.36
      command: ["sh", "-c", "echo '=== /data listing ==='; ls -la /data; echo '=== md5sum ==='; md5sum /data/* 2>/dev/null || echo 'no files'; echo '=== data.txt ==='; cat /data/data.txt 2>/dev/null || echo '(no data.txt)'; sleep 300"]
      volumeMounts:
        - name: vol
          mountPath: /data
  volumes:
    - name: vol
      persistentVolumeClaim:
        claimName: dr-restore-pvc