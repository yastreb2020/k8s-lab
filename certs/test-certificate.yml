# Фаза 3 PKI: тестовый Certificate для *.kubernetes.lab от intermediate-ca-issuer.
# Проверка: secret test-cert-tls → openssl verify leaf → intermediate → root (Neurotech CA).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-wildcard
  namespace: default
spec:
  secretName: test-cert-tls
  duration: 2160h   # 90 days
  renewBefore: 720h # 30 days
  commonName: "*.kubernetes.lab"
  dnsNames:
  - "*.kubernetes.lab"
  - "kubernetes.lab"
  issuerRef:
    name: intermediate-ca-issuer
    kind: ClusterIssuer
