# Фаза 3 PKI: Secret с корневым Neurotech CA (публичный cert, не секрет).
# trust-manager будет распространять его в ConfigMap во всех namespace'ах.
# Создаётся командой:
#   kubectl create secret generic neurotech-root-ca \
#     --from-file=ca.crt=<neurotech-ca.crt> -n cert-manager
# (манифестом не коммитится — файл с cert лежит в test-dir, здесь только шаблон)
apiVersion: v1
kind: Secret
metadata:
  name: neurotech-root-ca
  namespace: cert-manager
type: Opaque
data:
  ca.crt: <base64-of-neurotech-ca.crt>
