# Фаза 3 PKI: ClusterIssuer на основе промежуточного CA (Neurotech-подписанный).
# Secret intermediate-ca (tls.crt + tls.key) создаётся отдельно из
# pki/intermediate-ca.crt + pki/intermediate-ca.key.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: intermediate-ca-issuer
spec:
  ca:
    secretName: intermediate-ca
