apiVersion: apps/v1
kind: Deployment
metadata:
  name: metallb-test-app
  namespace: metallb-system
  labels:
    app: metallb-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metallb-test
  template:
    metadata:
      labels:
        app: metallb-test
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: metallb-test-svc
  namespace: metallb-system
  annotations:
    metallb.universe.tf/address-pool: test-pool
spec:
  selector:
    app: metallb-test
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP