# Test for MetalLB (kubernetes.lab v2): deploy + LoadBalancer service
# Verified 2026-09-03: EXTERNAL-IP 172.24.254.221 allocated from lab-pool, HTTP 200 from WSL/w0/cp0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metallb-test
  namespace: metallb-system
  labels:
    app: metallb-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metallb-test
  template:
    metadata:
      labels:
        app: metallb-test
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: metallb-test-svc
  namespace: metallb-system
spec:
  type: LoadBalancer
  selector:
    app: metallb-test
  ports:
  - port: 80
    targetPort: 80