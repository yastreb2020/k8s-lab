# kubernetes.lab v2: MetalLB v0.15.3, public quay.io images, L2 mode
# Applied 2026-09-03: helm upgrade --install metallb metallb/metallb --version 0.15.3 -f metallb-values.yml -n metallb-system --create-namespace
imagePullSecrets: []
rbac:
  create: true

prometheus:
  rbacProxy:
    repository: gcr.io/kubebuilder/kube-rbac-proxy
    tag: v0.12.0
    pullPolicy:

controller:
  enabled: true
  logLevel: info
  webhookMode: enabled
  image:
    repository: quay.io/metallb/controller
    tag: v0.15.3
    pullPolicy:

speaker:
  enabled: true
  logLevel: info

  image:
    repository: quay.io/metallb/speaker
    tag: v0.15.3
    pullPolicy:
  frr:
    enabled: false
    metricsPort: 7473
    resources: {}

crds:
  enabled: true